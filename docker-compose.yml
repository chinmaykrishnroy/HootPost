services:
  api:
    build:
      context: ./App_BackEndAPI
    env_file:
      - ./App_BackEndAPI/.env.example
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: hootpost
      MONGO_INITDB_ROOT_PASSWORD: hootpost
      MONGO_INITDB_DATABASE: hootpost
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hootpost
      MINIO_ROOT_PASSWORD: hootpost-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 hootpost hootpost-secret &&
      mc mb --ignore-existing local/hootpost &&
      mc anonymous set none local/hootpost
      "

volumes:
  mongo-data:
  redis-data:
  minio-data:
